query globalHistoryPage($path: String!, $offset: Int, $limit: Int, $filter: InputGlobalHistoryFilter) {
    jcr {
        nodeByPath(path: $path) {
            uuid
            globalHistory {
                totalCount(filter: $filter)
                entries(offset: $offset, limit: $limit, filter: $filter) {
                    id
                    timestamp
                    uuid
                    path
                    action
                    propertyName
                    userKey
                    message
                    language
                    nodeExists
                    nodeName
                }
            }
        }
    }
}
